name: Build Instant Server Executables (Windows, macOS, Linux)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  self-test-suite:
    name: Verify All 10 Instant Server Modules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Deterministic Self-Tests Across All Modules
        run: |
          python3 m1_host_probe.py --self-test
          python3 m2_iso_manager.py --self-test
          python3 m3_usb_engine.py --self-test
          python3 m4_config_builder.py --self-test
          python3 m5_payload_packager.py --self-test
          python3 p1_early_hardware_adapter.py --self-test
          bash p2_late_laptop_hardening.sh --self-test
          python3 instant_server_cli.py --self-test
          python3 vm_test_harness.py --self-test
          python3 build_executables.py --self-test

  build-executables:
    name: Package Standalone Executable (${{ matrix.os }})
    needs: self-test-suite
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyInstaller 6.x, Pillow & Lightweight Native PyQt6 GUI
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow PyQt6

      - name: Generate Packaging Spec, Taskbar Icons (.ico/.icns/.png) & Manifests
        run: python build_executables.py --emit-configs ./build_dist

      - name: Build Standalone Binary via PyInstaller
        shell: bash
        run: |
          cp ./build_dist/InstantServer.spec ./InstantServer.spec
          cp ./build_dist/instant_server_icon.ico ./instant_server_icon.ico
          cp ./build_dist/instant_server_icon.icns ./instant_server_icon.icns
          cp ./build_dist/instant_server_icon.png ./instant_server_icon.png
          pyinstaller --clean --noconfirm InstantServer.spec

      - name: Ad-Hoc Codesign & Package DMG (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: bash ./build_dist/macos_codesign_and_dmg.sh

      - name: Verify Exact Output Filename (InstantServer-Windows.exe / InstantServer-macOS.dmg / InstantServer-Linux)
        shell: bash
        run: |
          ls -la dist/
          if [[ "${{ matrix.os }}" == windows* ]]; then
            test -f "dist/InstantServer-Windows.exe"
          elif [[ "${{ matrix.os }}" == macos* ]]; then
            test -f "dist/InstantServer-macOS.dmg"
          else
            chmod +x "dist/InstantServer-Linux"
            test -f "dist/InstantServer-Linux"
          fi

      - name: Upload Executable Package
        uses: actions/upload-artifact@v6
        with:
          name: instant-server-${{ matrix.os }}
          path: |
            dist/InstantServer-Windows.exe
            dist/InstantServer-macOS.dmg
            dist/InstantServer-Linux
          if-no-files-found: error