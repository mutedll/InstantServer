name: Build Instant Server Executables (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  self-test-suite:
    name: Verify All 10 Instant Server Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Deterministic Self-Tests Across All Modules
        run: |
          python3 m1_host_probe.py --self-test
          python3 m2_iso_manager.py --self-test
          python3 m3_usb_engine.py --self-test
          python3 m4_config_builder.py --self-test
          python3 m5_payload_packager.py --self-test
          python3 p1_early_hardware_adapter.py --self-test
          bash p2_late_laptop_hardening.sh --self-test
          python3 instant_server_cli.py --self-test
          python3 vm_test_harness.py --self-test
          python3 build_executables.py --self-test

  build-executables:
    name: Package Standalone Executable (${{ matrix.os }})
    needs: self-test-suite
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller 6.x
        run: pip install pyinstaller
      - name: Generate Packaging Spec & Platform Manifests
        run: python3 build_executables.py --emit-configs ./build_dist
      - name: Build Standalone Binary via PyInstaller
        run: |
          cp ./build_dist/InstantServer.spec ./InstantServer.spec
          pyinstaller --clean --noconfirm InstantServer.spec
      - name: Ad-Hoc Codesign & Package DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: bash ./build_dist/macos_codesign_and_dmg.sh
