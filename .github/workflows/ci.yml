# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]

    steps:
      - name: Checkout Repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Compile & Verify Native C11 USB Flasher (win_usb_flasher.c)
        shell: bash
        run: |
          SRC_C="src/instant_server/native/win_usb_flasher.c"
          [ -f "$SRC_C" ] || SRC_C="win_usb_flasher.c"
          printf "\n" >> "$SRC_C"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            gcc -std=c11 -O3 -Wall -Wextra -Wpedantic -Werror "$SRC_C" -o win_usb_flasher.exe
            ./win_usb_flasher.exe --self-test
          else
            gcc -std=c11 -O3 -Wall -Wextra -Wpedantic -Werror "$SRC_C" -o win_usb_flasher
            ./win_usb_flasher --self-test
          fi

      - name: Run Automated Test Suite & VM Matrix Simulation
        shell: bash
        run: |
          PY_BIN="python3"
          command -v python3 >/dev/null 2>&1 || PY_BIN="python"
          "$PY_BIN" -m py_compile instant_server.py build_executables.py
          "$PY_BIN" tests/test_suite.py
          "$PY_BIN" tests/vm_test_harness.py --self-test
          "$PY_BIN" build_executables.py --self-test