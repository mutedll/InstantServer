# .github/workflows/release.yml
name: Build & Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: InstantServer-Windows.exe
          - os: macos-latest
            artifact_name: InstantServer-macOS.dmg
          - os: ubuntu-latest
            artifact_name: InstantServer-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Native C USB Flasher
        shell: bash
        run: |
          SRC_C="win_usb_flasher.c"
          [ -f "src/instant_server/native/win_usb_flasher.c" ] && SRC_C="src/instant_server/native/win_usb_flasher.c"
          gcc -O3 -Wall -Wextra "$SRC_C" -o win_usb_flasher
          ./win_usb_flasher --self-test

      - name: Install PyInstaller & GUI Runtime
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Run Automated Test Suite
        run: python test_suite.py

      - name: Build Standalone Executable
        run: python build_executables.py --build

      - name: Upload Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*