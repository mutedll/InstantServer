# .github/workflows/release.yml
name: Build & Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binaries:
    name: Build (${{ matrix.artifact_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: InstantServer-Windows.exe
          - os: macos-15-intel
            artifact_name: InstantServer-macOS.dmg
          - os: ubuntu-24.04
            artifact_name: InstantServer-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Compile Native C11 USB Flasher
        shell: bash
        run: |
          SRC_C="src/instant_server/native/win_usb_flasher.c"
          [ -f "$SRC_C" ] || SRC_C="win_usb_flasher.c"
          printf "\n" >> "$SRC_C"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            gcc -std=c11 -O3 -Wall -Wextra -Wpedantic -Werror "$SRC_C" -o src/instant_server/native/win_usb_flasher.exe
            ./src/instant_server/native/win_usb_flasher.exe --self-test
          else
            gcc -std=c11 -O3 -Wall -Wextra -Wpedantic -Werror "$SRC_C" -o src/instant_server/native/win_usb_flasher
            ./src/instant_server/native/win_usb_flasher --self-test
          fi

      - name: Install PyInstaller & Lightweight WebView Runtime
        shell: bash
        run: |
          PY_BIN="python3"
          command -v python3 >/dev/null 2>&1 || PY_BIN="python"
          "$PY_BIN" -m pip install --upgrade pip
          "$PY_BIN" -m pip install pyinstaller pillow pywebview

      - name: Run Automated Test Suite
        shell: bash
        run: |
          PY_BIN="python3"
          command -v python3 >/dev/null 2>&1 || PY_BIN="python"
          "$PY_BIN" tests/test_suite.py

      - name: Build Standalone Executable
        shell: bash
        run: |
          PY_BIN="python3"
          command -v python3 >/dev/null 2>&1 || PY_BIN="python"
          "$PY_BIN" build_executables.py --emit-configs ./build_dist
          cp ./build_dist/InstantServer.spec ./InstantServer.spec
          cp ./build_dist/instant_server_icon.ico ./instant_server_icon.ico
          cp ./build_dist/instant_server_icon.icns ./instant_server_icon.icns
          cp ./build_dist/instant_server_icon.png ./instant_server_icon.png
          pyinstaller --clean --noconfirm InstantServer.spec
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash ./build_dist/macos_codesign_and_dmg.sh
          fi

      - name: Upload Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}