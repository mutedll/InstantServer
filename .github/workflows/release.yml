name: Build & Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-executables:
    name: Build (${{ matrix.binary_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            binary_name: InstantServer-Windows.exe
          - os: macos-15-intel
            binary_name: InstantServer-macOS.dmg
          - os: ubuntu-24.04
            binary_name: InstantServer-Linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: Install Linux GTK3 & WebKit2GTK 4.1 Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Prepare Directory Layout & Run Go Unit Tests
        shell: bash
        run: |
          mkdir -p usb network privilege build/windows frontend/wailsjs/go/main src/instant_server/ui src/instant_server/scripts dist
          for f in flasher_common.go flasher_linux.go flasher_darwin.go flasher_windows.go scanner.go payload_builder.go catalog.go iso_downloader.go cidata_fat.go flasher_test.go; do
            [ -f "$f" ] && [ ! -f "usb/$f" ] && cp "$f" "usb/$f" || true
          done
          for f in mdns_discovery.go mdns_test.go; do
            [ -f "$f" ] && [ ! -f "network/$f" ] && cp "$f" "network/$f" || true
          done
          for f in escalate.go escalate_test.go; do
            [ -f "$f" ] && [ ! -f "privilege/$f" ] && cp "$f" "privilege/$f" || true
          done
          [ -f "wails.exe.manifest" ] && [ ! -f "build/windows/wails.exe.manifest" ] && cp "wails.exe.manifest" "build/windows/wails.exe.manifest" || true
          [ -f "app_ui.html" ] && [ ! -f "src/instant_server/ui/app_ui.html" ] && cp "app_ui.html" "src/instant_server/ui/app_ui.html" || true
          [ -f "server_dashboard.html" ] && [ ! -f "src/instant_server/ui/server_dashboard.html" ] && cp "server_dashboard.html" "src/instant_server/ui/server_dashboard.html" || true
          for ujf in catalog_data.js app_studio.js; do [ -f "$ujf" ] && [ ! -f "src/instant_server/ui/$ujf" ] && cp "$ujf" "src/instant_server/ui/$ujf" || true; done
          [ -f "laptop_hardening.sh" ] && [ ! -f "src/instant_server/scripts/laptop_hardening.sh" ] && cp "laptop_hardening.sh" "src/instant_server/scripts/laptop_hardening.sh" || true
          sed -i 's/\r$//' src/instant_server/scripts/laptop_hardening.sh 2>/dev/null || true
          go mod tidy
          go test -v ./usb/... ./network/... ./privilege/...

      - name: Build Native Standalone Executable (Wails + Go)
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          export PATH="$(go env GOPATH)/bin:$PATH"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wails build -clean -skipbindings -o InstantServer-Windows.exe || go build -ldflags="-s -w -H windowsgui" -o build/bin/InstantServer-Windows.exe .
            cp build/bin/InstantServer-Windows.exe dist/InstantServer-Windows.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            wails build -clean -skipbindings || go build -ldflags="-s -w" -o build/bin/InstantServer .
            mkdir -p build/dmg_staging
            if [ -d "build/bin/InstantServer.app" ]; then
              cp -R "build/bin/InstantServer.app" build/dmg_staging/
            else
              cp build/bin/InstantServer build/dmg_staging/
            fi
            hdiutil create -volname "Instant Server" -srcfolder build/dmg_staging -ov -format UDZO dist/InstantServer-macOS.dmg
          else
            wails build -clean -skipbindings -tags webkit2_41 -o InstantServer-Linux || go build -tags webkit2_41 -ldflags="-s -w" -o build/bin/InstantServer-Linux .
            cp build/bin/InstantServer-Linux dist/InstantServer-Linux
            chmod +x dist/InstantServer-Linux
          fi
          ls -lh dist/

      - name: Upload Release Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error

      - name: Publish to GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.binary_name }}
          generate_release_notes: true