name: Build & Release Executables

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-executables:
    name: Build (${{ matrix.binary_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            binary_name: InstantServer-Windows.exe
          - os: macos-26-intel
            binary_name: InstantServer-macOS.dmg
          - os: ubuntu-26.04
            binary_name: InstantServer-Linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Install Linux GTK3 & WebKit2GTK 4.1 Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Prepare Go Packages, Icons & Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p usb network privilege build/windows frontend/wailsjs/go/main src/instant_server/ui src/instant_server/scripts dist
          for f in flasher_common.go flasher_linux.go flasher_darwin.go flasher_windows.go scanner.go payload_builder.go catalog.go iso_downloader.go cidata_fat.go flasher_test.go; do
            [ -f "$f" ] && mv -f "$f" "usb/$f" || true
          done
          for f in mdns_discovery.go mdns_test.go; do
            [ -f "$f" ] && mv -f "$f" "network/$f" || true
          done
          for f in escalate.go escalate_test.go; do
            [ -f "$f" ] && mv -f "$f" "privilege/$f" || true
          done
          [ -f "wails.exe.manifest" ] && cp -f "wails.exe.manifest" "build/windows/wails.exe.manifest" || true
          [ -f "appicon.png" ] && cp -f "appicon.png" "build/appicon.png" || true
          [ -f "icon.ico" ] && cp -f "icon.ico" "build/windows/icon.ico" || true
          for uif in app_ui.html server_dashboard.html catalog_data.js app_studio.js; do
            [ -f "$uif" ] && cp -f "$uif" "src/instant_server/ui/$uif" || true
          done
          for scf in laptop_hardening.sh sanitize_autoinstall.py instant_dashboard_daemon.py; do
            [ -f "$scf" ] && cp -f "$scf" "src/instant_server/scripts/$scf" || true
          done
          sed -i 's/\r$//' src/instant_server/scripts/laptop_hardening.sh 2>/dev/null || true

          if [ ! -f "go.mod" ]; then
            go mod init github.com/InstantServer/InstantServer
          fi
          MOD_NAME=$(awk '/^module /{print $2}' go.mod | tr -d '\r')
          if [ -f "app.go" ] && [ -n "$MOD_NAME" ]; then
            sed -i.bak \
              -e "s|github.com/instant-server/instant-server/|${MOD_NAME}/|g" \
              -e "s|github.com/InstantServer/InstantServer/|${MOD_NAME}/|g" \
              app.go main.go && rm -f app.go.bak main.go.bak
          fi

          go get github.com/wailsapp/wails/v2@latest
          go mod tidy
          go test -v ./usb/... ./network/... ./privilege/...

      - name: Generate IS App Icon (.png, .ico, and Windows PE .syso Resource)
        shell: bash
        run: |
          python3 - << 'PYICON'
          import struct, zlib, os
          os.makedirs("build/windows", exist_ok=True)
          def is_glyph(nx, ny):
              if 0.26 <= ny <= 0.335 and 0.20 <= nx <= 0.44: return True
              if 0.665 <= ny <= 0.74 and 0.20 <= nx <= 0.44: return True
              if 0.26 <= ny <= 0.74 and 0.285 <= nx <= 0.355: return True
              if 0.26 <= ny <= 0.335 and 0.50 <= nx <= 0.80: return True
              if 0.26 <= ny <= 0.538 and 0.50 <= nx <= 0.575: return True
              if 0.462 <= ny <= 0.538 and 0.50 <= nx <= 0.80: return True
              if 0.462 <= ny <= 0.74 and 0.725 <= nx <= 0.80: return True
              if 0.665 <= ny <= 0.74 and 0.50 <= nx <= 0.80: return True
              return False
          def in_rrect(x, y, x0, y0, x1, y1, r):
              if x < x0 or x >= x1 or y < y0 or y >= y1: return False
              if (x0+r <= x < x1-r) or (y0+r <= y < y1-r): return True
              cx = x0+r if x < x0+r else x1-r-1
              cy = y0+r if y < y0+r else y1-r-1
              return (x-cx)**2 + (y-cy)**2 <= r*r
          def make_png(sz):
              rad = int(sz * 0.21)
              brd = max(2, int(sz * 0.045))
              m = max(1, int(sz * 0.03))
              x0, y0, x1, y1 = m, m, sz-m, sz-m
              ix0, iy0, ix1, iy1, ir = x0+brd, y0+brd, x1-brd, y1-brd, max(2, rad-brd)
              rows = []
              for y in range(sz):
                  ny = y / float(sz)
                  bval = 0x36 + int((1.0 - ny) * 14.0)
                  row = bytearray([0])
                  for x in range(sz):
                      nx = x / float(sz)
                      if not in_rrect(x, y, x0, y0, x1, y1, rad):
                          row.extend((0, 0, 0, 0))
                      elif not in_rrect(x, y, ix0, iy0, ix1, iy1, ir):
                          row.extend((0x31, 0xA8, 0xFF, 255))
                      elif is_glyph(nx, ny):
                          row.extend((0x66, 0xC4, 0xFF, 255))
                      else:
                          row.extend((0x00, 0x1E, bval, 255))
                  rows.append(bytes(row))
              raw = b"".join(rows)
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", sz, sz, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          png256 = make_png(256)
          png64 = make_png(64)
          png32 = make_png(32)
          png16 = make_png(16)
          for p in ["appicon.png", "build/appicon.png"]:
              with open(p, "wb") as f: f.write(png256)
          imgs = [(256, png256), (64, png64), (32, png32), (16, png16)]
          ico_hdr = struct.pack("<HHH", 0, 1, len(imgs))
          offset = 6 + 16 * len(imgs)
          entries, blobs = [], []
          for sz, data in imgs:
              w = 0 if sz == 256 else sz
              entries.append(struct.pack("<BBBBHHII", w, w, 0, 0, 1, 32, len(data), offset))
              blobs.append(data)
              offset += len(data)
          ico_bytes = ico_hdr + b"".join(entries) + b"".join(blobs)
          for p in ["icon.ico", "build/windows/icon.ico"]:
              with open(p, "wb") as f: f.write(ico_bytes)
          # Also build rsrc_windows_amd64.syso COFF resource object so go build embeds the IS icon and UAC manifest
          grp_hdr = struct.pack("<HHH", 0, 1, len(imgs))
          grp_entries = []
          for idx, (sz, data) in enumerate(imgs, 1):
              w = 0 if sz == 256 else sz
              grp_entries.append(struct.pack("<BBBBHHIH", w, w, 0, 0, 1, 32, len(data), idx))
          grp_data = grp_hdr + b"".join(grp_entries)
          def pad8(b): return b + b"\x00" * ((8 - len(b) % 8) % 8)
          # RT_ICON (3), RT_GROUP_ICON (14), RT_MANIFEST (24)
          manifest = open("build/windows/wails.exe.manifest", "rb").read() if os.path.exists("build/windows/wails.exe.manifest") else b""
          print("Generated IS appicon.png and multi-size icon.ico")
          PYICON
          go install github.com/tc-hib/go-winres@latest 2>/dev/null || true
          export PATH="$(go env GOPATH)/bin:$PATH"
          if command -v go-winres >/dev/null 2>&1; then
            go-winres simply --icon build/windows/icon.ico --manifest build/windows/wails.exe.manifest 2>/dev/null || true
          fi

      - name: Build Native Standalone Executable (Wails + Go)
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wails build -clean -skipbindings -o InstantServer-Windows.exe || go build -tags desktop,production -ldflags="-s -w -H windowsgui" -o build/bin/InstantServer-Windows.exe .
            cp build/bin/InstantServer-Windows.exe dist/InstantServer-Windows.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            wails build -clean -skipbindings || go build -tags desktop,production -ldflags="-s -w" -o build/bin/InstantServer .
            mkdir -p build/dmg_staging
            if [ -d "build/bin/InstantServer.app" ]; then
              cp -R "build/bin/InstantServer.app" build/dmg_staging/
            else
              cp build/bin/InstantServer build/dmg_staging/
            fi
            hdiutil create -volname "Instant Server" -srcfolder build/dmg_staging -ov -format UDZO dist/InstantServer-macOS.dmg
          else
            wails build -clean -skipbindings -tags webkit2_41 -o InstantServer-Linux || go build -tags desktop,production,webkit2_41 -ldflags="-s -w" -o build/bin/InstantServer-Linux .
            cp build/bin/InstantServer-Linux dist/InstantServer-Linux
            chmod +x dist/InstantServer-Linux
          fi
          ls -lh dist/

      - name: Upload Release Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error

      - name: Publish to GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" "dist/${{ matrix.binary_name }}" --clobber