# pyproject.toml
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-server"
version = "2.7.0"
description = "Turn any laptop, desktop PC, or Mini-PC into a self-healing Ubuntu home server or multi-node cluster via bootable USB"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Instant Server Contributors"}]
dependencies = [
    "PyQt6>=6.5.0",
    "PyQt6-WebEngine>=6.5.0",
]

[project.scripts]
instant-server = "instant_server.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]

[tool.pyright]
include = ["src", "tests", "instant_server.py", "build_executables.py"]
extraPaths = ["src", "src/instant_server", "src/instant_server/scripts", "."]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"