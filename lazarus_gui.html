<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Server</title>

  />
  <link rel="shortcut icon" href="/favicon.ico" />
  <style>
    /* ==========================================================================
       Windows 11 Fluent Design System (WinUI 3) Tokens + Smooth Setup Animations
       ========================================================================== */
    :root,
    [data-theme="light"] {
      color-scheme: light;
      --font-sans: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      --font-display: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "Cascadia Code", "Consolas", ui-monospace, SFMono-Regular, monospace;

      /* Mica & Acrylic Surfaces (Light) */
      --mica-bg: #F3F3F3;
      --mica-tint: radial-gradient(circle at 12% 8%, rgba(0, 103, 192, 0.06), transparent 52%),
                   radial-gradient(circle at 88% 90%, rgba(0, 120, 212, 0.04), transparent 50%);
      --acrylic-sidebar: rgba(243, 243, 243, 0.78);
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-bg-hover: rgba(255, 255, 255, 0.96);
      --card-bg-secondary: rgba(249, 249, 249, 0.65);
      --control-bg: #FFFFFF;
      --control-bg-hover: #FBFBFB;
      --control-bg-active: #F0F0F0;
      --input-bg: #FFFFFF;

      /* WinUI 3 Flyout / Dropdown Menu Tokens (Light) */
      --flyout-bg: #F9F9F9;
      --flyout-border: rgba(0, 0, 0, 0.14);
      --flyout-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      --flyout-item-hover: rgba(0, 0, 0, 0.055);
      --flyout-item-selected: rgba(0, 0, 0, 0.075);

      /* Blended Sleek Scrollbar Tokens (Light) */
      --scroll-track-active: rgba(0, 0, 0, 0.05);
      --scroll-thumb-idle: rgba(0, 0, 0, 0.16);
      --scroll-thumb-active: rgba(0, 0, 0, 0.42);

      /* Borders & Elevation (Strict 8px Radius, 1px Low-Contrast Stroke) */
      --radius: 8px;
      --border-card: rgba(0, 0, 0, 0.065);
      --border-control: rgba(0, 0, 0, 0.12);
      --border-control-bottom: rgba(0, 0, 0, 0.24);
      --shadow-card: 0 2px 6px rgba(0, 0, 0, 0.035);
      --shadow-control: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-setup: 0 14px 38px rgba(0, 0, 0, 0.10);

      /* Text Hierarchy */
      --text-primary: #1A1A1A;
      --text-secondary: #5C5C5C;
      --text-tertiary: #868686;

      /* Accent & Semantic Tokens */
      --accent: #0067C0;
      --accent-hover: #1874D0;
      --accent-active: #005299;
      --accent-text: #FFFFFF;
      --accent-subtle: rgba(0, 103, 192, 0.09);

      --success: #0F7B0F;
      --success-bg: rgba(15, 123, 15, 0.10);
      --warning: #9D5D00;
      --warning-bg: rgba(157, 93, 0, 0.12);
      --danger: #C42B1C;
      --danger-bg: rgba(196, 43, 28, 0.10);
      --nav-hover: rgba(0, 0, 0, 0.045);
      --nav-active: rgba(0, 0, 0, 0.075);
      --divider: rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      /* Mica & Acrylic Surfaces (Dark) */
      --mica-bg: #202020;
      --mica-tint: radial-gradient(circle at 12% 8%, rgba(76, 194, 255, 0.06), transparent 52%),
                   radial-gradient(circle at 88% 90%, rgba(0, 103, 192, 0.05), transparent 50%);
      --acrylic-sidebar: rgba(32, 32, 32, 0.76);
      --card-bg: rgba(255, 255, 255, 0.052);
      --card-bg-hover: rgba(255, 255, 255, 0.082);
      --card-bg-secondary: rgba(255, 255, 255, 0.032);
      --control-bg: rgba(255, 255, 255, 0.065);
      --control-bg-hover: rgba(255, 255, 255, 0.10);
      --control-bg-active: rgba(255, 255, 255, 0.04);
      --input-bg: rgba(255, 255, 255, 0.055);

      /* WinUI 3 Flyout / Dropdown Menu Tokens (Dark - Matches Windows 11 Settings) */
      --flyout-bg: #2C2C2C;
      --flyout-border: rgba(255, 255, 255, 0.12);
      --flyout-shadow: 0 10px 28px rgba(0, 0, 0, 0.52);
      --flyout-item-hover: rgba(255, 255, 255, 0.075);
      --flyout-item-selected: rgba(255, 255, 255, 0.095);

      /* Blended Sleek Scrollbar Tokens (Dark - Matches Windows 11 Settings) */
      --scroll-track-active: rgba(255, 255, 255, 0.045);
      --scroll-thumb-idle: rgba(255, 255, 255, 0.16);
      --scroll-thumb-active: rgba(255, 255, 255, 0.45);

      /* Borders & Elevation */
      --border-card: rgba(255, 255, 255, 0.075);
      --border-control: rgba(255, 255, 255, 0.095);
      --border-control-bottom: rgba(255, 255, 255, 0.18);
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.22);
      --shadow-control: 0 1px 2px rgba(0, 0, 0, 0.26);
      --shadow-setup: 0 18px 46px rgba(0, 0, 0, 0.42);

      /* Text Hierarchy */
      --text-primary: #FFFFFF;
      --text-secondary: #C5C5C5;
      --text-tertiary: #8A8A8A;

      /* Accent & Semantic Tokens */
      --accent: #4CC2FF;
      --accent-hover: #60C9FF;
      --accent-active: #38B0F0;
      --accent-text: #000000;
      --accent-subtle: rgba(76, 194, 255, 0.13);

      --success: #6CCB5F;
      --success-bg: rgba(108, 203, 95, 0.14);
      --warning: #FCE100;
      --warning-bg: rgba(252, 225, 0, 0.12);
      --danger: #FF99A4;
      --danger-bg: rgba(255, 153, 164, 0.14);
      --nav-hover: rgba(255, 255, 255, 0.055);
      --nav-active: rgba(255, 255, 255, 0.09);
      --divider: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ==========================================================================
       Sleek Windows 11 Blended Scrollbar (Thin Line Idle, Blended Pill on Hover/Scroll)
       ========================================================================== */
    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
      background: transparent;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 999px;
      margin: 4px 0;
    }
    *::-webkit-scrollbar-corner {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background-color: var(--scroll-thumb-idle);
      border-radius: 999px;
      border: 3.5px solid transparent;
      background-clip: padding-box;
      transition: background-color 0.2s ease, border-width 0.2s ease;
    }
    *:hover::-webkit-scrollbar-track,
    *.is-scrolling::-webkit-scrollbar-track {
      background: var(--scroll-track-active);
    }
    *:hover::-webkit-scrollbar-thumb,
    *.is-scrolling::-webkit-scrollbar-thumb {
      background-color: var(--scroll-thumb-active);
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    *::-webkit-scrollbar-thumb:hover,
    *::-webkit-scrollbar-thumb:active {
      background-color: var(--scroll-thumb-active);
      border: 1.5px solid transparent;
      background-clip: padding-box;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-primary);
      background-color: var(--mica-bg);
      background-image: var(--mica-tint);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    .app-window {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      border-radius: var(--radius);
      overflow: hidden;
      transition: background-color 0.25s ease;
    }

    /* ==========================================================================
       Unified Native Titlebar (Text Title Only, Merged Search, Zero Fake OS Buttons)
       ========================================================================== */
    .window-titlebar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--acrylic-sidebar);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
      gap: 16px;
      z-index: 20;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 170px;
    }

    .titlebar-back {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.14s ease, transform 0.1s ease;
    }
    .titlebar-back:hover {
      background: var(--nav-hover);
    }
    .titlebar-back:active {
      transform: scale(0.93);
    }

    .app-brand-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    /* Merged Search Bar on Window Bar */
    .titlebar-center {
      flex: 1;
      max-width: 460px;
      display: flex;
      align-items: center;
      position: relative;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .titlebar-center.hidden-in-setup {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
    }

    .titlebar-search-input {
      width: 100%;
      height: 32px;
      padding: 0 34px 0 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border-control);
      border-bottom: 1.5px solid var(--border-control-bottom);
      background: var(--input-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .titlebar-search-input:focus {
      border-color: var(--accent);
      border-bottom: 2px solid var(--accent);
      background: var(--control-bg);
    }
    .titlebar-search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      font-size: 13px;
    }

    .titlebar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 170px;
    }

    /* ==========================================================================
       Smooth Tab-Only Animation & Non-Overlapping Vertical Flow Stack
       ========================================================================== */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-tab-switch {
      animation: fadeSlideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .tab-flow-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ==========================================================================
       MODE 1: First-Run Windows Setup Window (Pinned Top Tabs + Scrollable Body)
       ========================================================================== */
    .setup-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
      overflow: hidden;
    }

    .setup-window-card {
      width: 100%;
      max-width: 860px;
      max-height: 100%;
      flex: 1;
      min-height: 0;
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-setup);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .setup-top-tabs {
      flex-shrink: 0;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px 0;
      border-bottom: 1px solid var(--divider);
      background: var(--card-bg-secondary);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .setup-tab-btn {
      flex-shrink: 0;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px 11px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius) var(--radius) 0 0;
      transition: color 0.16s ease, background 0.16s ease, transform 0.1s ease;
      white-space: nowrap;
    }
    .setup-tab-btn:hover {
      color: var(--text-primary);
      background: var(--nav-hover);
    }
    .setup-tab-btn:active {
      transform: scale(0.97);
    }
    .setup-tab-btn.active {
      color: var(--text-primary);
      font-weight: 600;
    }
    .setup-tab-btn.active::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--accent);
    }

    .setup-tab-step-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--control-bg);
      border: 1px solid var(--border-control);
      color: var(--text-secondary);
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    .setup-tab-btn.active .setup-tab-step-dot {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .setup-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setup-header-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .setup-header-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .setup-footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-top: 1px solid var(--divider);
      background: var(--card-bg-secondary);
      gap: 12px;
      flex-wrap: wrap;
    }
    .setup-footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Animated Advanced Options Expander */
    .expander-wrap {
      border-radius: var(--radius);
      border: 1px solid var(--border-card);
      background: var(--card-bg-secondary);
      transition: border-color 0.2s ease;
      flex-shrink: 0;
    }
    .expander-header {
      width: 100%;
      padding: 14px 18px;
      background: transparent;
      border: none;
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s ease;
      text-align: left;
    }
    .expander-header:hover {
      background: var(--nav-hover);
    }
    .expander-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: var(--text-secondary);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 14px;
    }
    .expander-wrap.open .expander-chevron {
      transform: rotate(180deg);
    }
    .expander-content-grid {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .expander-wrap.open .expander-content-grid {
      grid-template-rows: 1fr;
    }
    .expander-content-inner {
      overflow: hidden;
    }
    .expander-wrap.open .expander-content-inner {
      overflow: visible;
    }
    .expander-body {
      padding: 10px 14px 14px;
      border-top: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ==========================================================================
       MODE 2: Windows 11 Settings Two-Column Layout
       ========================================================================== */
    .settings-shell {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .nav-sidebar {
      width: 256px;
      flex-shrink: 0;
      background: var(--acrylic-sidebar);
      backdrop-filter: blur(28px) saturate(135%);
      -webkit-backdrop-filter: blur(28px) saturate(135%);
      padding: 12px 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-right: 1px solid var(--divider);
      overflow-y: auto;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 38px;
      padding: 0 12px;
      border-radius: var(--radius);
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 400;
      cursor: pointer;
      text-align: left;
      transition: background 0.14s ease, transform 0.1s ease;
    }
    .nav-item:hover {
      background: var(--nav-hover);
    }
    .nav-item:active {
      transform: scale(0.985);
    }
    .nav-item.active {
      background: var(--nav-active);
      font-weight: 600;
    }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 3px;
      background: var(--accent);
    }
    .nav-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .content-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 36px 44px;
    }

    .content-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      gap: 12px;
    }

    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
    }
    .breadcrumb-link {
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.12s ease;
    }
    .breadcrumb-link:hover {
      color: var(--text-primary);
    }
    .breadcrumb-sep {
      color: var(--text-tertiary);
      font-size: 20px;
      font-weight: 400;
    }

    .system-summary-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 22px;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      flex-wrap: wrap;
    }
    .summary-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .summary-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .summary-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .summary-pills {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .summary-pill {
      padding: 6px 12px;
      border-radius: var(--radius);
      background: var(--card-bg-secondary);
      border: 1px solid var(--border-card);
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .summary-pill strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Windows 11 Setting Cards */
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 4px 0 0;
    }

    .card-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .win-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
    }
    .win-card.clickable {
      cursor: pointer;
    }
    .win-card.clickable:hover {
      background: var(--card-bg-hover);
    }
    .win-card.clickable:active {
      transform: scale(0.996);
    }
    .win-card.selected-accent {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }
    .card-icon {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .card-text {
      min-width: 0;
    }
    .card-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .card-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Self-Hosted App Store Toolbar & Grid */
    .appstore-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--card-bg-secondary);
      border: 1px solid var(--border-card);
    }
    .appstore-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .appstore-filter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-pill {
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border-control);
      background: var(--control-bg);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }
    .filter-pill:hover {
      background: var(--control-bg-hover);
      color: var(--text-primary);
    }
    .filter-pill.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 600;
    }

    .appstore-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 8px;
    }
    .app-card {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
    }
    .app-card:hover {
      background: var(--card-bg-hover);
    }
    .app-card:active {
      transform: scale(0.994);
    }
    .app-card.checked {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }
    .app-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      margin-top: 2px;
      flex-shrink: 0;
      pointer-events: none;
    }

    /* Controls */
    .win-btn {
      height: 34px;
      padding: 0 15px;
      border-radius: var(--radius);
      border: 1px solid var(--border-control);
      border-bottom: 1.5px solid var(--border-control-bottom);
      background: var(--control-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-control);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.14s ease, transform 0.1s ease, border-color 0.14s ease;
    }
    .win-btn:hover:not(:disabled) {
      background: var(--control-bg-hover);
    }
    .win-btn:active:not(:disabled) {
      transform: scale(0.97);
      background: var(--control-bg-active);
    }
    .win-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .win-btn-sm {
      height: 29px;
      padding: 0 11px;
      font-size: 12px;
    }

    .win-btn-accent {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      border-bottom-color: var(--accent-active);
      font-weight: 600;
    }
    .win-btn-accent:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    .win-btn-accent:active:not(:disabled) {
      background: var(--accent-active);
      transform: scale(0.97);
    }

    .win-btn-large {
      height: 40px;
      padding: 0 26px;
      font-size: 14px;
    }

    .win-input {
      height: 34px;
      min-width: 210px;
      padding: 0 11px;
      border-radius: var(--radius);
      border: 1px solid var(--border-control);
      border-bottom: 1.5px solid var(--border-control-bottom);
      background: var(--input-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      box-shadow: var(--shadow-control);
      outline: none;
      transition: border-color 0.14s ease, background 0.14s ease;
    }
    .win-input:focus {
      border-color: var(--accent);
      border-bottom: 2px solid var(--accent);
      background: var(--control-bg);
    }

    /* Windows 11 Settings Custom ComboBox Dropdown */
    .win-combobox {
      position: relative;
      min-width: 240px;
      user-select: none;
    }
    .win-combobox-trigger {
      width: 100%;
      height: 34px;
      padding: 0 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border-control);
      border-bottom: 1.5px solid var(--border-control-bottom);
      background: var(--control-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 400;
      box-shadow: var(--shadow-control);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
    }
    .win-combobox-trigger:hover {
      background: var(--control-bg-hover);
    }
    .win-combobox-trigger:active {
      transform: scale(0.985);
    }
    .win-combobox.open .win-combobox-trigger {
      border-color: var(--accent);
    }
    .win-combobox-chevron {
      font-size: 12px;
      color: var(--text-secondary);
      transition: transform 0.18s ease;
    }
    .win-combobox.open .win-combobox-chevron {
      transform: rotate(180deg);
    }
    .win-combobox-menu {
      position: absolute;
      top: calc(100% + 5px);
      right: 0;
      min-width: 100%;
      padding: 5px;
      border-radius: var(--radius);
      background: var(--flyout-bg);
      border: 1px solid var(--flyout-border);
      box-shadow: var(--flyout-shadow);
      z-index: 80;
      display: none;
      flex-direction: column;
      gap: 2px;
      animation: fadeSlideUp 0.14s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .win-combobox.open .win-combobox-menu {
      display: flex;
    }
    .win-combobox-option {
      position: relative;
      width: 100%;
      padding: 8px 12px 8px 14px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.12s ease;
      white-space: nowrap;
    }
    .win-combobox-option:hover {
      background: var(--flyout-item-hover);
    }
    .win-combobox-option.selected {
      background: var(--flyout-item-selected);
      font-weight: 500;
    }
    .win-combobox-option.selected::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 3px;
      background: var(--accent);
    }

    /* WinUI Toggle Switch */
    .win-switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .win-switch-label {
      font-size: 13px;
      color: var(--text-secondary);
      min-width: 26px;
      text-align: right;
    }
    .win-switch-track {
      width: 40px;
      height: 20px;
      border-radius: 999px;
      border: 1px solid var(--text-secondary);
      background: transparent;
      position: relative;
      transition: background 0.16s ease, border-color 0.16s ease;
    }
    .win-switch-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-secondary);
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background 0.16s ease;
    }
    .win-switch.on .win-switch-track {
      background: var(--accent);
      border-color: var(--accent);
    }
    .win-switch.on .win-switch-thumb {
      background: var(--accent-text);
      transform: translateX(20px);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-accent {
      background: var(--accent-subtle);
      color: var(--accent);
    }
    .badge-success {
      background: var(--success-bg);
      color: var(--success);
    }
    .badge-warning {
      background: var(--warning-bg);
      color: var(--warning);
    }
    .badge-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* Validation & Warning Box */
    .notice-banner {
      padding: 13px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--danger);
      background: var(--danger-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .notice-banner-warning {
      border-color: var(--warning);
      background: var(--warning-bg);
    }

    /* Flashing Progress & Live Logs Card */
    .flash-panel {
      padding: 18px 20px;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--card-bg-secondary);
      border: 1px solid var(--border-card);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .flash-terminal-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .flash-log-box {
      background: rgba(10, 12, 16, 0.78);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      color: #d4dce8;
      max-height: 210px;
      overflow-y: auto;
      user-select: text;
      overscroll-behavior: contain;
    }
    html[data-theme="light"] .flash-log-box {
      background: #181c24;
      color: #e2e8f0;
    }
    .term-log-line {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 1px 0;
    }
    .term-live-progress {
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(96, 205, 255, 0.12);
      border: 1px solid rgba(96, 205, 255, 0.28);
      color: #60cdff;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .resume-scroll-pill {
      position: absolute;
      right: 14px;
      bottom: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      z-index: 5;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .resume-scroll-pill:hover {
      transform: translateY(-1px);
    }
    .win-btn-danger {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
      font-weight: 600;
    }
    .win-btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: #ffffff;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: 20px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-dialog {
      width: 100%;
      max-width: 460px;
      background: var(--acrylic-sidebar);
      border: 1px solid var(--border-control);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-setup);
      padding: 22px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .modal-body {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    .bottom-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      margin-top: 6px;
      border-top: 1px solid var(--divider);
      gap: 12px;
    }
    .center-flash-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 0 4px;
      gap: 12px;
    }

    .code-viewer {
      background: var(--card-bg-secondary);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-primary);
      max-height: 300px;
      overflow: auto;
      white-space: pre;
      user-select: text;
    }

    .toast-msg {
      position: fixed;
      bottom: 20px;
      right: 24px;
      padding: 10px 16px;
      border-radius: var(--radius);
      background: var(--acrylic-sidebar);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-control);
      box-shadow: var(--shadow-setup);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      z-index: 90;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      .settings-shell {
        flex-direction: column;
      }
      .nav-sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        border-right: none;
        border-bottom: 1px solid var(--divider);
      }
      .nav-list {
        flex-direction: row;
      }
      .content-area {
        padding: 18px 16px 32px;
      }
      .win-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .card-right, .win-input, .win-combobox {
        width: 100%;
      }
      .titlebar-left, .titlebar-right {
        min-width: auto;
      }
      .appstore-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    async function callBackend(endpoint, method = "GET", payload = null) {
      try {
        if (window.location.protocol.startsWith("http")) {
          const targetUrl = window.location.origin + "/" + "api/" + endpoint;
          const opts = {
            method,
            headers: { "Content-Type": "application/json" },
            cache: "no-store"
          };
          if (payload && method === "POST") {
            opts.body = JSON.stringify(payload);
          }
          const resp = await fetch(targetUrl, opts);
          if (resp.ok) {
            return await resp.json();
          }
        }
        if (window.pywebview && window.pywebview.api) {
          const api = window.pywebview.api;
          if (endpoint === "load-config" && api.load_config) return await api.load_config();
          if (endpoint === "save-config" && api.save_config) return await api.save_config(payload);
          if (endpoint === "usb" && api.scan_usb_devices) return await api.scan_usb_devices();
          if (endpoint === "flash" && api.start_build) return await api.start_build(payload);
          if (endpoint === "cancel" && api.cancel_build) return await api.cancel_build();
          if (endpoint === "heartbeat" && api.heartbeat) return await api.heartbeat();
          if (endpoint === "shutdown" && api.shutdown_app) return await api.shutdown_app(true);
          if (endpoint === "status" && api.poll_build_status) return await api.poll_build_status();
          if (endpoint === "discover" && api.discover_servers) return await api.discover_servers(state.hostname);
        }
      } catch (_err) {}
      return null;
    }

    function applyConfigToState(cfg) {
      if (!cfg || typeof cfg !== "object") return;
      const keys = [
        "hostname", "username", "password", "wifi_ssid", "wifi_password",
        "enable_usb_tethering", "static_ip_cidr", "static_gateway",
        "dashboard_choice", "prebundle_offline_images", "enable_pihole_dns_prep",
        "enable_samba_nas", "enable_intel_vaapi", "enable_tailscale", "tailscale_authkey",
        "laptop_age_hint", "laptop_ram_hint", "usb_partition_scheme", "custom_iso_path",
        "confirm_usb_erase", "install_mode", "dual_boot_Allocation_gb", "confirm_erase_main_drive",
        "ubuntu_release", "storage_layout", "boot_mode", "ignore_lid_switch",
        "screen_blank_seconds", "battery_charge_start_pct", "battery_charge_stop_pct",
        "ups_shutdown_battery_pct", "enable_low_ram_zram", "safe_gpu_nomodeset"
      ];
      keys.forEach(k => {
        if (cfg[k] !== undefined) state[k] = cfg[k];
      });
      if (Array.isArray(cfg.selected_apps)) {
        state.selected_apps = cfg.selected_apps;
      }
      if (cfg.custom_iso_path && String(cfg.custom_iso_path).trim()) {
        state.iso_source_mode = "local_file";
      }
      state.screen_blank_seconds = String(state.screen_blank_seconds || "60");
      state.ubuntu_release = String(state.ubuntu_release || "26.04");
      if (Array.isArray(cfg.static_dns)) {
        state.static_dns = cfg.static_dns.join(", ");
      }
      if (Array.isArray(cfg.ssh_authorized_keys) && cfg.ssh_authorized_keys.length > 0) {
        state.ssh_authorized_key = cfg.ssh_authorized_keys[0];
      }
    }

    function checkIncompleteRequirements() {
      const missing = [];
      if (!state.hostname || !/^[a-z0-9][a-z0-9-]{0,61}$/i.test(state.hostname.trim())) {
        missing.push("Enter a valid Server Name (letters, numbers, hyphens).");
      }
      if (!state.username || !/^[a-z_][a-z0-9_-]{0,31}$/i.test(state.username.trim())) {
        missing.push("Enter a valid Admin Username.");
      }
      if (!state.password && !state.ssh_authorized_key.trim()) {
        missing.push("Set an Admin Password (or add an SSH key in Network advanced options).");
      }
      if (state.wifi_ssid.trim() && state.wifi_password.length > 0 && state.wifi_password.length < 8) {
        missing.push("Wi-Fi password must be at least 8 characters.");
      }
      if (state.install_mode === "auto_erase" && !state.confirm_erase_main_drive) {
        missing.push("Confirm 'I know what I'm doing' for Erase Main Drive mode, or switch to Dual-Boot.");
      }
      if (state.iso_source_mode === "local_file" && !state.custom_iso_path.trim()) {
        missing.push("Enter the file path to your local Ubuntu Server .iso file, or switch to Automatic Official ISO Download.");
      }
      const usb = state.usbDevices.find(d => d.device_id === state.selectedUsbId && d.triple_lock_passed);
      if (!usb) {
        missing.push("Select an approved removable USB flash drive in Laptop & USB.");
      }
      if (!state.confirm_usb_erase) {
        missing.push("Confirm that all existing data on the selected USB drive will be erased and formatted.");
      }
      return missing;
    }

    function buildAsciiTerminalBar(pct, label, detail) {
      const clamped = Math.max(0, Math.min(100, Number(pct) || 0));
      const width = 22;
      const filled = Math.round((clamped / 100) * width);
      const bar = "█".repeat(filled) + "░".repeat(Math.max(0, width - filled));
      const pctStr = clamped.toFixed(1).padStart(5, " ") + "%";
      return detail
        ? `⟳ ${label}: [${bar}] ${pctStr} │ ${detail}`
        : `⟳ ${label}: [${bar}] ${pctStr}`;
    }

    function updateFlashPanelInPlace() {
      const panel = document.getElementById("flashPanelCard");
      if (!panel) {
        renderApp();
        return;
      }

      const titleEl = document.getElementById("flashStatusTitle");
      if (titleEl) {
        titleEl.textContent = state.flashStatusText || "Preparing bootable USB...";
      }

      const badgeEl = document.getElementById("flashBadgePct");
      if (badgeEl) {
        badgeEl.textContent = `${state.flashProgress}%`;
        badgeEl.className = "badge " + (
          state.flashProgress === 100
            ? "badge-success"
            : state.flashCancelled
            ? "badge-warning"
            : "badge-accent"
        );
      }

      const fillEl = document.getElementById("flashProgressFill");
      if (fillEl) {
        fillEl.style.width = `${state.flashProgress}%`;
      }

      const hdrActions = document.getElementById("flashPanelHeaderActions");
      if (hdrActions) {
        const hasCancelBtn = !!hdrActions.querySelector("[data-action='cancel-flash']");
        if (state.flashing && !hasCancelBtn) {
          hdrActions.innerHTML = `<button type="button" class="win-btn win-btn-sm win-btn-danger" data-action="cancel-flash">✕ Cancel flashing</button>`;
        } else if (!state.flashing && hasCancelBtn) {
          hdrActions.innerHTML = "";
        }
      }

      // Update footer / primary flash buttons in place so user sees Cancel / Flash status without re-rendering DOM
      document.querySelectorAll("[data-action='start-flash']").forEach(btn => {
        btn.disabled = state.flashing;
        btn.textContent = state.flashing ? "Flashing Bootable USB..." : "Confirm & Flash Bootable USB";
      });
      document.querySelectorAll(".footer-cancel-flash-wrap").forEach(wrap => {
        wrap.style.display = state.flashing ? "inline-flex" : "none";
      });

      const linesContainer = document.getElementById("flashLogLines");
      if (linesContainer) {
        const existingNodes = linesContainer.children;
        while (existingNodes.length > state.flashLogs.length) {
          linesContainer.removeChild(linesContainer.lastChild);
        }
        for (let i = 0; i < state.flashLogs.length; i++) {
          if (i < existingNodes.length) {
            if (existingNodes[i].textContent !== state.flashLogs[i]) {
              existingNodes[i].textContent = state.flashLogs[i];
            }
          } else {
            const row = document.createElement("div");
            row.className = "term-log-line";
            row.textContent = state.flashLogs[i];
            linesContainer.appendChild(row);
          }
        }
        state.renderedLogCount = state.flashLogs.length;
      }

      const liveRow = document.getElementById("flashTerminalLiveRow");
      if (liveRow) {
        if (state.activeProgressLine) {
          liveRow.style.display = "block";
          liveRow.textContent = state.activeProgressLine;
        } else {
          liveRow.style.display = "none";
          liveRow.textContent = "";
        }
      }

      scrollTerminalToBottomIfSticky();
    }

    async function cancelFlashingProcess(exitAfterCancel = false) {
      clearInterval(pollTimer);
      pollTimer = null;
      await callBackend("cancel", "POST");
      state.flashing = false;
      state.flashCancelled = true;
      state.activeProgressLine = "";
      state.flashStatusText = "Flashing cancelled by user — safe to unplug or retry anytime.";
      state.flashLogs.push("[CANCELLED] Flashing stopped by user. Any partial ISO download is saved for resume.");
      updateFlashPanelInPlace();
      showToast("Flashing cancelled");
      if (exitAfterCancel) {
        state.forceClosing = true;
        await callBackend("shutdown", "POST", { force: true });
        window.close();
      }
    }

    async function startFlashingProcess() {
      if (state.flashing) return;
      const missing = checkIncompleteRequirements();
      state.validationErrors = missing;
      if (missing.length > 0) {
        showToast("Complete required settings before flashing");
        renderApp();
        return;
      }

      const payload = serializeProfilePayload();
      try {
        localStorage.setItem("instant_server_saved_config", JSON.stringify(payload));
      } catch (_e) {}

      state.flashing = true;
      state.flashCancelled = false;
      state.flashProgress = 6;
      state.logAutoScroll = true;
      state.renderedLogCount = 0;
      const flashStartEpoch = Date.now();
      const spinFrames = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
      let spinIdx = 0;
      state.flashStatusText = `Preparing Ubuntu Server ${state.ubuntu_release} LTS bootable USB...`;
      state.flashLogs = [
        "[00:00] Saved config to Instant_Server_Data/instant-server-config.json"
      ];
      state.activeProgressLine = buildAsciiTerminalBar(6.0, "Initializing Pipeline", "Checking local ISO cache & Ubuntu mirrors...");
      renderApp();
      state.renderedLogCount = state.flashLogs.length;
      scrollTerminalToBottomIfSticky();

      // Scroll outer pane once so the terminal panel is comfortably in view
      setTimeout(() => {
        const panel = document.getElementById("flashPanelCard");
        if (panel && panel.scrollIntoView) {
          panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }, 60);

      const startRes = await callBackend("flash", "POST", payload);
      if (startRes && startRes.started) {
        clearInterval(pollTimer);
        pollTimer = setInterval(async () => {
          const snap = await callBackend("status", "GET");
          if (!snap) return;
          if (snap.close_warning_requested && window.__showCloseWhileFlashingWarning) {
            window.__showCloseWhileFlashingWarning();
          }
          if (!state.flashing) return;

          spinIdx = (spinIdx + 1) % spinFrames.length;
          const elapsedSec = Math.max(0, Math.floor((Date.now() - flashStartEpoch) / 1000));
          const elapsedStr = `${String(Math.floor(elapsedSec / 60)).padStart(2, "0")}:${String(elapsedSec % 60).padStart(2, "0")}`;

          state.flashProgress = Math.max(state.flashProgress, Number(snap.percent) || 6);

          if (Array.isArray(snap.events) && snap.events.length > 0) {
            const backendLines = [];
            let latestInPlaceFromEvents = null;
            snap.events.forEach((ev, idx) => {
              const evName = String(ev.event || "");
              const msg = String(ev.message || "");
              if (evName.endsWith("_PROGRESS") || (ev.data && ev.data.in_place)) {
                latestInPlaceFromEvents = ev;
              } else {
                const lineText = ev.formatted_line || `[00:${String(idx + 1).padStart(2, "0")}] ${msg}`;
                backendLines.push(lineText);
              }
            });
            state.flashLogs = [
              "[00:00] Saved config to Instant_Server_Data/instant-server-config.json",
              ...backendLines
            ];
            state.flashStatusText = snap.events[snap.events.length - 1].message || state.flashStatusText;

            if (snap.active_progress && snap.active_progress.terminal_line) {
              state.activeProgressLine = `${spinFrames[spinIdx]} ${snap.active_progress.terminal_line.replace(/^⟳\s*/, "")}`;
              state.flashStatusText = snap.active_progress.message || state.flashStatusText;
            } else if (latestInPlaceFromEvents) {
              const d = latestInPlaceFromEvents.data || {};
              const stPct = Number(d.stage_percent ?? d.download_percent ?? d.percent ?? state.flashProgress);
              state.activeProgressLine = buildAsciiTerminalBar(stPct, d.label || "Progress", latestInPlaceFromEvents.message).replace(/^⟳/, spinFrames[spinIdx]);
              state.flashStatusText = latestInPlaceFromEvents.message;
            } else if (snap.status === "RUNNING") {
              state.activeProgressLine = buildAsciiTerminalBar(
                state.flashProgress,
                "Active Stage",
                `${state.flashStatusText} (Elapsed ${elapsedStr})`
              ).replace(/^⟳/, spinFrames[spinIdx]);
            }
          } else if (snap.status === "RUNNING") {
            state.activeProgressLine = buildAsciiTerminalBar(
              state.flashProgress,
              "Active Stage",
              `${state.flashStatusText} (Elapsed ${elapsedStr})`
            ).replace(/^⟳/, spinFrames[spinIdx]);
          }

          if (snap.status === "COMPLETED") {
            clearInterval(pollTimer);
            pollTimer = null;
            state.flashing = false;
            state.flashProgress = 100;
            state.activeProgressLine = "";
            const usbInfo = (snap.result && snap.result.usb_provision) || {};
            const copiedCount = Array.isArray(usbInfo.copied_files) ? usbInfo.copied_files.length : 0;
            const mountName = usbInfo.target_mount || usbInfo.target_device || "USB drive";
            state.flashStatusText = "Bootable USB drive is ready! Plug it into your old laptop and power it on.";
            state.flashLogs.push(`[DONE] Verified bootable Ubuntu Server ISO + ${copiedCount} cidata & app file(s) on ${mountName}.`);
            showToast("Bootable Instant Server USB is ready");
          } else if (snap.status === "CANCELLED") {
            clearInterval(pollTimer);
            pollTimer = null;
            state.flashing = false;
            state.flashCancelled = true;
            state.activeProgressLine = "";
            state.flashStatusText = "Flashing cancelled by user — safe to unplug or retry anytime.";
          } else if (snap.status === "FAILED") {
            clearInterval(pollTimer);
            pollTimer = null;
            state.flashing = false;
            state.activeProgressLine = "";
            state.flashStatusText = `Failed: ${snap.error || "Check logs"}`;
            state.flashLogs.push(`[ERROR] ${snap.error || "Provisioning failed"}`);
          }
          updateFlashPanelInPlace();
        }, 350);
        return;
      }

      // If running inside the desktop app (http://127.0.0.1 or pywebview), NEVER fall through
      // to the browser demo simulation if the backend returned an error!
      if (window.location.protocol.startsWith("http") || window.pywebview) {
        state.flashing = false;
        state.activeProgressLine = "";
        const errReason = (startRes && startRes.reason) ? startRes.reason : "Could not start background USB flashing service.";
        state.flashStatusText = `Failed: ${errReason}`;
        state.flashLogs.push(`[ERROR] ${errReason}`);
        updateFlashPanelInPlace();
        return;
      }

      // Browser preview simulation with realistic in-place terminal progress bar (no new-line spam!)
      const selectedUsb = state.usbDevices.find(d => d.device_id === state.selectedUsbId);
      const usbLabel = selectedUsb ? `${selectedUsb.model} (${selectedUsb.device_node})` : "USB Drive";
      const schemeDesc = state.usb_partition_scheme === "mbr_bios"
        ? "MBR (Legacy BIOS + CSM active boot)"
        : "GPT + Hybrid UEFI/BIOS";

      const simPhases = [
        { type: "log", pct: 10, msg: `[00:03] Resolving official Ubuntu Server ${state.ubuntu_release}.1 LTS mirror & SHA256SUMS...` },
        { type: "bar", pct: 16, stagePct: 28.4, label: "Downloading Ubuntu ISO", detail: "749.8 / 2640.0 MB @ 24.5 MB/s" },
        { type: "bar", pct: 24, stagePct: 64.2, label: "Downloading Ubuntu ISO", detail: "1694.9 / 2640.0 MB @ 25.1 MB/s" },
        { type: "bar", pct: 34, stagePct: 100.0, label: "Downloading Ubuntu ISO", detail: "2640.0 / 2640.0 MB @ 25.0 MB/s" },
        { type: "log", pct: 40, msg: `[00:06] Official Ubuntu Server ${state.ubuntu_release}.1 LTS ISO SHA-256 checksum verified!` },
        { type: "log", pct: 46, msg: `[00:07] Formatting ${usbLabel} as ${schemeDesc} (label: CIDATA)...` },
        { type: "bar", pct: 58, stagePct: 42.0, label: "Writing Bootable ISO to USB", detail: "1092.0 / 2600.0 MB (casper/vmlinuz & initrd)" },
        { type: "bar", pct: 74, stagePct: 88.5, label: "Writing Bootable ISO to USB", detail: "2301.0 / 2600.0 MB (casper/ubuntu-server-minimal.squashfs)" },
        { type: "log", pct: 86, msg: `[00:10] Pre-unpacking ${state.selected_apps.length} self-hosted CasaOS app bundle(s) (${state.selected_apps.slice(0, 4).join(", ")}${state.selected_apps.length > 4 ? "..." : ""}) onto USB...` },
        { type: "done", pct: 100, msg: "[DONE] Bootable Ubuntu Server ISO + GRUB autoinstall + pre-unpacked apps written to USB." }
      ];
      let idx = 0;
      clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        if (!state.flashing || idx >= simPhases.length) {
          clearInterval(pollTimer);
          pollTimer = null;
          return;
        }
        const step = simPhases[idx++];
        state.flashProgress = step.pct;
        if (step.type === "log") {
          state.activeProgressLine = "";
          state.flashLogs.push(step.msg);
          state.flashStatusText = step.msg.replace(/^\[[0-9:]+\]\s*/, "");
        } else if (step.type === "bar") {
          state.activeProgressLine = buildAsciiTerminalBar(step.stagePct, step.label, step.detail);
          state.flashStatusText = `${step.label}: ${step.detail}`;
        } else if (step.type === "done") {
          state.activeProgressLine = "";
          state.flashLogs.push(step.msg);
          state.flashStatusText = "Bootable USB drive is ready! Plug it into your old laptop and power it on.";
          state.flashing = false;
          clearInterval(pollTimer);
          pollTimer = null;
          showToast("Bootable Instant Server USB is ready");
        }
        updateFlashPanelInPlace();
      }, 480);
    }

    function renderSetupView() {
      const topTabsEl = document.getElementById("setupTopTabs");
      const bodyEl = document.getElementById("setupBodyContent");
      const footerEl = document.getElementById("setupFooterBar");

      topTabsEl.innerHTML = SETUP_TABS.map((t, idx) => {
        const active = state.setupTab === t.id;
        return `
          <button type="button" class="setup-tab-btn ${active ? "active" : ""}" data-action="switch-setup-tab" data-tab="${t.id}">
            <span class="setup-tab-step-dot">${idx + 1}</span>
            <span>${esc(t.label)}</span>
          </button>
        `;
      }).join("");

      const tabIdx = SETUP_TABS.findIndex(t => t.id === state.setupTab);
      const headers = {
        network: { title: "Connect your server", desc: "Name your server and optionally enter your home Wi-Fi details." },
        apps: { title: "Choose dashboards & self-hosted apps", desc: "Pick your web dashboard and check the self-hosted apps you want pre-bundled onto the USB drive." },
        storage: { title: "Target laptop details & bootable USB", desc: "Tell us if you know how old the laptop is (or pick 'I don't know' for universal boot) and select your USB stick." },
        power: { title: "Laptop power & battery settings", desc: "Configure lid-close behavior and battery protection for 24/7 operation." },
        finish: { title: "Ready to format & flash bootable USB", desc: "Pulls the official Ubuntu Server ISO, formats the USB drive, and bundles your config and selected apps." }
      };
      const hdr = headers[state.setupTab] || headers.network;

      let contentHtml = "";
      if (state.setupTab === "network") contentHtml = buildNetworkSection();
      else if (state.setupTab === "apps") contentHtml = buildAppsSection();
      else if (state.setupTab === "storage") contentHtml = buildStorageSection();
      else if (state.setupTab === "power") contentHtml = buildPowerSection();
      else contentHtml = buildFinishSection();

      const animClass = shouldAnimateTab ? "animate-tab-switch" : "";
      shouldAnimateTab = false;

      bodyEl.innerHTML = `
        <div class="${animClass} tab-flow-stack">
          <div>
            <h1 class="setup-header-title">${esc(hdr.title)}</h1>
            <p class="setup-header-desc">${esc(hdr.desc)}</p>
          </div>
          ${contentHtml}
        </div>
      `;

      const isFirst = tabIdx <= 0;
      const isLast = tabIdx === SETUP_TABS.length - 1;

      footerEl.innerHTML = `
        <div>
          <button type="button" class="win-btn" data-action="setup-prev" ${isFirst ? "disabled" : ""}>← Previous</button>
        </div>
        <div class="setup-footer-right">
          ${!isLast ? `
            <button type="button" class="win-btn" data-action="setup-skip">Skip</button>
            <button type="button" class="win-btn win-btn-accent" data-action="setup-next">Proceed →</button>
          ` : `
            <button type="button" class="win-btn" data-action="save-config-home">Save configuration</button>
            <span class="footer-cancel-flash-wrap" style="display:${state.flashing ? "inline-flex" : "none"};">
              <button type="button" class="win-btn win-btn-danger" data-action="cancel-flash">✕ Cancel flashing</button>
            </span>
            <button type="button" class="win-btn win-btn-accent win-btn-large" data-action="start-flash" ${state.flashing ? "disabled" : ""}>
              ${state.flashing ? "Flashing Bootable USB..." : "Confirm & Flash Bootable USB"}
            </button>
          `}
        </div>
      `;
    }
